<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F4F6FA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bates Electric" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="ui-dialogs.css" />
  <title>Bates Electric — Contacts</title>
</head>
<body class="hub-body">
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="hub-main">
    <section class="hub-welcome">
      <h2>Contacts</h2>
      <p>Reach the right person fast</p>
    </section>

    <!-- Search -->
    <div class="contacts-search">
      <span class="contacts-search-icon" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input id="contacts-filter" class="contacts-search-input" type="search" placeholder="Search by name, role, or email" autocomplete="off" spellcheck="false" />
    </div>

    <p id="contacts-empty" class="contacts-empty" hidden>No contacts match your search.</p>

    <!-- Emergency -->
    <section class="contacts-section" data-group="emergency">
      <h3 class="contacts-section-title">Emergency</h3>
      <a href="tel:911" class="contact-card contact-card--emergency"
         data-search="emergency 911 fire police medical">
        <span class="contact-avatar contact-avatar--emergency" aria-hidden="true">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </span>
        <div class="contact-body">
          <div class="contact-name">Call 911</div>
          <div class="contact-role">For life-threatening emergencies</div>
        </div>
        <span class="contact-cta" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.77 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        </span>
      </a>
    </section>

    <!-- Office -->
    <section class="contacts-section" data-group="office">
      <h3 class="contacts-section-title">Office</h3>
      <article class="contact-card contact-card--detail"
               data-search="bates electric office headquarters arnold mo 63010 sierra parkway main">
        <div class="contact-card-head">
          <span class="contact-avatar contact-avatar--brand" aria-hidden="true">
            <img src="logo-icon.png?v=7" alt="" width="36" height="36" style="display:block;" />
          </span>
          <div class="contact-body">
            <div class="contact-name">Bates Electric, Inc.</div>
            <div class="contact-role">Headquarters</div>
            <div class="contact-meta">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span>2006 Sierra Pkwy, Arnold, MO 63010</span>
            </div>
          </div>
        </div>
        <div class="contact-actions">
          <a class="contact-action" href="tel:6364643939" aria-label="Call office">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 13a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.77 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l.91-.91a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>(636) 464-3939</span>
          </a>
          <a class="contact-action" href="https://www.google.com/maps/search/?api=1&query=2006+Sierra+Pkwy+Arnold+MO+63010" target="_blank" rel="noopener" aria-label="Open address in maps">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21 3 6"/><line x1="9" y1="3" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="21"/></svg>
            <span>Directions</span>
          </a>
          <a class="contact-action" href="http://www.bates-electric.com" target="_blank" rel="noopener" aria-label="Open website">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
            <span>Website</span>
          </a>
          <button type="button" class="contact-action" data-copy="(636) 464-3939" aria-label="Copy phone number">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>Copy</span>
          </button>
        </div>
      </article>
    </section>

    <!-- Team directory — people data is NOT in this file. contacts.js fetches
         it from the authenticated /contacts-directory endpoint and renders the
         cards here, so names/emails aren't exposed in the public static HTML. -->
    <div id="contacts-directory" aria-live="polite">
      <p id="contacts-directory-loading" class="contacts-empty">Loading directory&hellip;</p>
    </div>

    <div id="contacts-toast" class="contacts-toast" role="status" aria-live="polite" hidden></div>
  </main>

  <script src="shared-nav.js"></script>
  <script src="ui-dialogs.js"></script>
  <script src="contacts.js"></script>
</body>
</html>
