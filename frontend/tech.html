<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F4F6FA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bates Electric" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="ui-dialogs.css" />
  <title>Bates Electric &mdash; My Day</title>
  <!-- Synchronous pre-paint role guard: an office user is redirected to /home
       before any of the My Day shell can paint (async /me stays authoritative). -->
  <script src="role-guard.js" data-page="tech"></script>
  <style>
    /* Field-tech "My Day" landing — mobile-first (~390px primary). v3: colors/
       radii/shadows read tokens.css; badges/buttons use the shared components.css
       system, so dark mode is the token swap — no html.dark overrides needed
       here except where the up-next card's navy gradient needs a dark variant. */
    .td-wrap { max-width: 720px; margin: 0 auto; padding: 4px 0 40px; }

    .td-safety { display: flex; align-items: center; gap: 10px; margin: -6px 0 22px; background: color-mix(in srgb, var(--warn-bg) 82%, transparent); border: 1px solid color-mix(in srgb, var(--warn) 26%, transparent); border-radius: var(--radius-sm); padding: 10px 12px; }
    .td-safety svg { color: var(--warn); flex-shrink: 0; }
    .td-safety div { font-size: 0.8rem; line-height: 1.35; }
    .td-safety strong { color: var(--ink); font-weight: 700; }
    .td-safety span { color: var(--ink-2); }

    /* Stat strip */
    .td-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-bottom: 26px; }
    .td-stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 10px; text-align: center; box-shadow: var(--shadow-1); }
    .td-stat-n { font-size: 1.5rem; font-weight: 800; line-height: 1; color: var(--ink); }
    .td-stat-n.td-warnc { color: var(--warn); }
    .td-stat-n.td-okc { color: var(--ok); }
    .td-stat-l { font-size: 0.68rem; font-weight: 600; color: var(--ink-2); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.04em; }

    .section-label.td-label-warn { color: var(--warn); }
    .section-label.td-label-warn::before { background: var(--warn); }

    /* WP6: enroll-a-customer action (card-shaped button above the stats) */
    .td-enroll { width: 100%; display: flex; align-items: center; gap: 13px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 14px; margin-bottom: 12px; box-shadow: var(--shadow-1); cursor: pointer; font-family: var(--font); transition: transform .14s var(--ease-spring), box-shadow .14s; }
    .td-enroll:active { transform: scale(.99); }
    .td-enroll-icon { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }
    .td-enroll-text { flex: 1; min-width: 0; }
    .td-enroll-text strong { display: block; font-weight: 700; font-size: 0.95rem; color: var(--ink); }
    .td-enroll-text span { display: block; font-size: 0.8rem; color: var(--ink-2); margin-top: 2px; }
    /* WP6.1 QR-first enroll sheet: the primary "Show signup QR" sits at the
       TOP (works with nothing filled); the capture form below it is clearly
       secondary/optional. */
    .td-enroll-go { width: 100%; padding: 13px; font-size: 0.95rem; font-weight: 700; border-radius: var(--radius-sm); margin: 2px 0 4px; }
    .td-enroll-opt { font-size: 0.74rem; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.05em; margin: 16px 0 10px; padding-top: 14px; border-top: 1px solid var(--line); }
    .td-enroll-opt span { display: block; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--ink-3); margin-top: 3px; }

    /* Up-next featured card */
    .td-upnext { background: linear-gradient(150deg, var(--navy-800), var(--navy-900)); border-radius: var(--radius); padding: 17px; color: #fff; box-shadow: var(--shadow-2); margin-bottom: 26px; position: relative; overflow: hidden; }
    html.dark .td-upnext { background: linear-gradient(150deg, #1E2A4C, #141b2e); border: 1px solid #2A3350; }
    .td-upnext-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .td-upnext-time { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 5px 11px; font-size: 0.78rem; font-weight: 700; }
    .td-upnext-time svg { opacity: 0.9; }
    .td-upnext-tag { font-size: 0.66rem; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: rgba(255,255,255,.6); }
    .td-upnext h3 { font-size: 1.25rem; font-weight: 800; line-height: 1.15; margin: 0; }
    .td-upnext-addr { font-size: 0.84rem; color: rgba(255,255,255,.78); margin-top: 4px; }
    .td-upnext-gen { font-size: 0.78rem; color: rgba(255,255,255,.62); margin-top: 9px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
    .td-upnext-gen .dot { width: 3px; height: 3px; border-radius: 50%; background: rgba(255,255,255,.4); }
    .td-upnext-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 15px; }
    .td-upnext-btn { font-family: var(--font); font-weight: 700; font-size: 0.84rem; border: 0; border-radius: var(--radius-sm); padding: 11px; display: flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; text-decoration: none; transition: transform .14s var(--ease-spring); }
    .td-upnext-btn:active { transform: scale(.965); }
    .td-upnext-btn-nav { background: #fff; color: var(--navy-900); grid-column: 1 / -1; }
    .td-upnext-btn-soft { background: rgba(255,255,255,.13); color: #fff; border: 1px solid rgba(255,255,255,.2); }

    .td-empty { text-align: center; color: var(--ink-2); padding: 34px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 26px; }
    .td-empty-icon { opacity: 0.5; margin-bottom: 8px; }

    /* Today / needs-attention cards */
    .td-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--shadow-1); display: flex; align-items: center; gap: 13px; cursor: pointer; transition: transform .14s var(--ease-spring), box-shadow .14s; }
    .td-card:active { transform: scale(.99); }
    .td-card.td-warncard { border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
    .td-card-pin { width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); }
    .td-card.td-warncard .td-card-pin { background: var(--warn-bg); color: var(--warn); }
    .td-card-mid { flex: 1; min-width: 0; }
    .td-card-cust { font-weight: 700; font-size: 0.95rem; color: var(--ink); }
    .td-card-meta { font-size: 0.8rem; color: var(--ink-2); margin-top: 2px; }
    .td-card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; flex-shrink: 0; }
    .td-card-chev { color: var(--ink-3); flex-shrink: 0; }
    button.badge { border: 0; cursor: pointer; font-family: inherit; }

    /* Upcoming condensed rows */
    .td-divider { height: 1px; background: var(--line); border: 0; margin: 8px 2px 0; }
    .td-urow { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .td-urow:last-child { border-bottom: 0; }
    .td-urow-d { width: 42px; text-align: center; flex-shrink: 0; }
    .td-urow-dow { font-size: 0.66rem; font-weight: 700; text-transform: uppercase; color: var(--ink-2); letter-spacing: 0.04em; }
    .td-urow-day { font-size: 1.15rem; font-weight: 800; line-height: 1; color: var(--ink); }
    .td-urow-mid { flex: 1; min-width: 0; }
    .td-urow-cust { font-weight: 600; font-size: 0.88rem; color: var(--ink); }
    .td-urow-meta { font-size: 0.76rem; color: var(--ink-2); margin-top: 1px; }

    /* Recently completed (de-emphasized, collapsed) */
    .td-done-note { text-align: center; font-size: 0.8rem; color: var(--ink-2); margin: 6px 2px 0; padding: 10px; cursor: pointer; }
    .td-done-note b { color: var(--ok); }

    /* Detail modal (full-screen on phones) — unchanged */
    .tvd-overlay { position: fixed; inset: 0; z-index: 1400; background: rgba(0,0,0,0.45); display: none; align-items: flex-start; justify-content: center; padding: 0; overflow-y: auto; }
    .tvd-overlay.open { display: flex; }
    .tvd-panel { background: var(--bg); width: 100%; max-width: 640px; min-height: 100vh; }
    .tvd-head { position: sticky; top: 0; background: var(--accent); color: var(--ink-inverse); padding: 14px 16px; display: flex; align-items: center; gap: 12px; z-index: 2; }
    .tvd-back { background: rgba(255,255,255,0.15); color: var(--ink-inverse); font-size: 1.1rem; width: 36px; height: 36px; padding: 0; border-radius: var(--radius-sm); line-height: 1; }
    .tvd-title { font-weight: 700; font-size: 1.05rem; }
    .tvd-body { padding: 14px 16px 40px; }
    .tvd-sec { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
    .tvd-sec h3 { margin: 0 0 10px; font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); }
    .tvd-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 0.92rem; }
    .tvd-row .k { color: var(--ink-2); flex-shrink: 0; }
    .tvd-row .v { color: var(--ink); text-align: right; font-weight: 600; }
    .tvd-action { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 700; text-decoration: none; }
    .tvd-action svg { flex-shrink: 0; }
    .tvd-note { font-size: 0.9rem; color: var(--ink); line-height: 1.5; white-space: pre-wrap; }
    .tvd-note-internal { background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); border-radius: var(--radius-sm); padding: 9px 11px; }
    /* Phase 2: visit photos + add-on checklist (tokens only, no hex) */
    .tvd-photo-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
    .tvd-photo-thumb { position: relative; width: 64px; height: 64px; }
    .tvd-photo-thumb img { width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--line); display: block; }
    .tvd-photo-del { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; padding: 0; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink-2); cursor: pointer; box-shadow: var(--shadow-1); }
    .tvd-photo-muted { color: var(--ink-2); font-size: 0.85rem; }
    .tvd-photo-status { color: var(--ink-2); font-size: 0.82rem; margin-bottom: 8px; }
    /* Per-visit service checklist (the plan's included services as a work list) */
    .tvd-check-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .tvd-check-head h3 { margin-bottom: 0; }
    .tvd-check-progress { font-size: 0.74rem; font-weight: 700; color: var(--ink-2); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; flex-shrink: 0; }
    .tvd-check-progress.is-all { background: var(--ok-bg); border-color: color-mix(in srgb, var(--ok) 30%, transparent); color: var(--ok); }
    .tvd-check-head + .tvd-addon-hint { margin-top: 8px; }
    .tvd-check-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 2px; cursor: pointer; font-family: var(--font); }
    .tvd-check-row:last-child { border-bottom: 0; padding-bottom: 4px; }
    div.tvd-check-row { cursor: default; }
    .tvd-check-box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); background: var(--bg); color: transparent; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .12s, border-color .12s, color .12s; }
    .tvd-check-row.is-done .tvd-check-box { background: var(--ok); border-color: var(--ok); color: #fff; }
    .tvd-check-label { font-size: 0.92rem; font-weight: 600; color: var(--ink); line-height: 1.35; }
    .tvd-check-row.is-done .tvd-check-label { color: var(--ink-2); }
    .tvd-addon-hint { font-size: 0.78rem; color: var(--ink-2); margin: -4px 0 8px; }
    .tvd-addon-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
    .tvd-addon-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .tvd-addon-label { font-size: 0.92rem; font-weight: 600; color: var(--ink); }
    .tvd-addon-side { display: flex; align-items: center; gap: 8px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
    /* Add-ons menu Phase 1: price line, charge footer, inline wrap-up fields */
    .tvd-addon-price { font-size: 0.82rem; color: var(--ink-2); font-weight: 600; margin-top: 1px; }
    .tvd-addon-foot { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    /* Phase 1.1 cart: custom-charge group heading + running total row */
    .tvd-cart-h { font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); font-weight: 700; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; margin-bottom: 6px; }
    .tvd-cart-total { display: flex; justify-content: space-between; align-items: center; gap: 10px; border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; font-size: 0.92rem; color: var(--ink-2); }
    .tvd-cart-total b { font-size: 1.05rem; color: var(--ink); }
    .tvd-fld { display: block; margin-bottom: 12px; }
    .tvd-fld span { display: block; font-size: 0.82rem; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
    .tvd-fld small { display: block; font-size: 0.75rem; color: var(--ink-2); margin-top: 3px; }
    .tvd-fld input, .tvd-fld textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--bg); color: var(--ink); padding: 9px 11px; font: inherit; font-size: 0.92rem; }
    .tvd-fld textarea { resize: vertical; min-height: 54px; }
    .tvd-cta { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 max(12px, env(safe-area-inset-bottom)); margin-top: 4px; }
    .tvd-complete { width: 100%; padding: 15px; font-size: 1rem; font-weight: 700; border-radius: var(--radius); }
    .tvd-done-banner { background: var(--ok-bg); color: var(--ok); border-radius: var(--radius); padding: 12px; text-align: center; font-weight: 700; font-size: 0.92rem; }
  </style>
</head>
<body class="hub-body dashboard-body">
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="dashboard-main">
    <div class="td-wrap">
      <!-- Hero: greeting + weather (shared hub-hero-* styling from app.css /
           BatesWeather from weather.js — same IDs as home.html's hero). -->
      <section class="hub-hero" id="hub-hero">
        <div class="hub-hero-text">
          <div class="hub-hero-meta">
            <span class="hub-hero-eyebrow" id="hero-date">&nbsp;</span>
            <span class="hub-hero-weather" id="hero-weather" hidden role="button" tabindex="0">
              <span class="hub-hero-weather-icon" id="hero-weather-icon"></span>
              <span class="hub-hero-weather-temp" id="hero-weather-temp"></span>
              <span class="hub-hero-weather-loc" id="hero-weather-loc"></span>
            </span>
          </div>
          <h1 class="hub-hero-title">
            <span id="hero-greet">Good morning</span><span class="hub-hero-comma">,</span>
            <span class="hub-hero-name" id="hero-name">there</span>
          </h1>
          <p class="hub-hero-sub" id="hero-sub">Loading your day&hellip;</p>
        </div>
      </section>

      <div class="td-safety">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <div><strong>Stay safe</strong> <span>&mdash; verify zero energy before you touch it.</span></div>
      </div>

      <!-- WP6: field enrollment — enroll a generator customer on the spot.
           Opens a quick capture form, then a signup QR the customer scans. -->
      <button type="button" class="td-enroll" id="td-enroll-btn">
        <span class="td-enroll-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M15 19.5c0-3-2.7-5-6-5s-6 2-6 5"/><path d="M18 6.5v6M15 9.5h6"/></svg></span>
        <span class="td-enroll-text">
          <strong>Enroll a customer</strong>
          <span>Show a signup QR they scan on their phone &mdash; done in minutes.</span>
        </span>
        <span class="td-card-chev"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span>
      </button>

      <!-- Stat strip -->
      <section class="td-stats">
        <div class="td-stat"><div class="td-stat-n" id="td-stat-today">&ndash;</div><div class="td-stat-l">Today</div></div>
        <div class="td-stat"><div class="td-stat-n td-warnc" id="td-stat-overdue">&ndash;</div><div class="td-stat-l">Overdue</div></div>
        <div class="td-stat"><div class="td-stat-n td-okc" id="td-stat-done">&ndash;</div><div class="td-stat-l">Done / wk</div></div>
      </section>

      <!-- Populated by tech.js -->
      <div id="td-upnext-wrap"></div>
      <div id="td-later-wrap"></div>
      <div id="td-attention-wrap"></div>
      <div id="td-upcoming-wrap"></div>
      <div id="td-done-wrap"></div>
    </div>
  </main>

  <!-- Visit detail (full-screen) -->
  <div id="tvd" class="tvd-overlay" aria-hidden="true">
    <div class="tvd-panel">
      <div class="tvd-head">
        <button type="button" class="btn btn-ghost btn-sm tvd-back" id="tvd-back" aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg></button>
        <div class="tvd-title">Visit detail</div>
      </div>
      <div class="tvd-body" id="tvd-body"><p>Loading…</p></div>
    </div>
  </div>

  <script src="shared-nav.js"></script>
  <script src="icons.js"></script>
  <script src="ui-dialogs.js"></script>
  <script src="qrcode.js"></script>
  <script src="arrival-windows.js"></script>
  <script src="weather.js"></script>
  <script src="tech.js"></script>
</body>
</html>
