<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F4F6FA" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bates Electric" />
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="tokens.css" />
  <link rel="stylesheet" href="components.css" />
  <link rel="stylesheet" href="app.css" />
  <link rel="stylesheet" href="ui-dialogs.css" />
  <title>Bates Electric &mdash; My Visits</title>
  <style>
    /* Field-tech view — mobile-first. Cards, not tables.
       v3: colors/radii/shadows read tokens.css; status chips use the shared
       .badge system and buttons the shared .btn system (components.css), so
       dark mode is the token swap — no html.dark overrides needed here. */
    .tv-wrap { max-width: 720px; margin: 0 auto; padding: 4px 0 40px; }
    .tv-h { font-size: 1.25rem; font-weight: 800; color: var(--ink); margin: 4px 2px 2px; }
    .tv-sub { color: var(--ink-2); font-size: 0.85rem; margin: 0 2px 14px; }
    .tv-group { margin-bottom: 22px; }
    .tv-group-h { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); margin: 0 2px 8px; }
    .tv-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 13px 14px; margin-bottom: 10px; box-shadow: var(--shadow-1); cursor: pointer; transition: box-shadow 0.12s, transform 0.04s; }
    .tv-card:active { transform: scale(0.995); }
    .tv-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .tv-cust { font-weight: 700; color: var(--ink); font-size: 1.02rem; }
    .tv-meta { color: var(--ink-2); font-size: 0.84rem; margin-top: 2px; }
    .tv-empty { text-align: center; color: var(--ink-2); padding: 40px 16px; }
    .tv-empty-icon { opacity: 0.5; margin-bottom: 8px; }

    /* Detail modal (full-screen on phones) */
    .tvd-overlay { position: fixed; inset: 0; z-index: 1400; background: rgba(0,0,0,0.45); display: none; align-items: flex-start; justify-content: center; padding: 0; overflow-y: auto; }
    .tvd-overlay.open { display: flex; }
    .tvd-panel { background: var(--bg); width: 100%; max-width: 640px; min-height: 100vh; }
    .tvd-head { position: sticky; top: 0; background: var(--accent); color: var(--ink-inverse); padding: 14px 16px; display: flex; align-items: center; gap: 12px; z-index: 2; }
    .tvd-back { background: rgba(255,255,255,0.15); color: var(--ink-inverse); font-size: 1.1rem; width: 36px; height: 36px; padding: 0; border-radius: var(--radius-sm); line-height: 1; }
    .tvd-title { font-weight: 700; font-size: 1.05rem; }
    .tvd-body { padding: 14px 16px 40px; }
    .tvd-sec { background: var(--surface); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
    .tvd-sec h3 { margin: 0 0 10px; font-size: 0.76rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); }
    .tvd-row { display: flex; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 0.92rem; }
    .tvd-row .k { color: var(--ink-2); flex-shrink: 0; }
    .tvd-row .v { color: var(--ink); text-align: right; font-weight: 600; }
    .tvd-action { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 700; text-decoration: none; }
    .tvd-action svg { flex-shrink: 0; }
    .tvd-note { font-size: 0.9rem; color: var(--ink); line-height: 1.5; white-space: pre-wrap; }
    .tvd-note-internal { background: var(--warn-bg); border: 1px solid color-mix(in srgb, var(--warn) 30%, transparent); border-radius: var(--radius-sm); padding: 9px 11px; }
    .tvd-cta { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0 max(12px, env(safe-area-inset-bottom)); margin-top: 4px; }
    .tvd-complete { width: 100%; padding: 15px; font-size: 1rem; font-weight: 700; border-radius: var(--radius); }
    .tvd-done-banner { background: var(--ok-bg); color: var(--ok); border-radius: var(--radius); padding: 12px; text-align: center; font-weight: 700; font-size: 0.92rem; }
  </style>
</head>
<body class="hub-body dashboard-body">
  <div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>

  <main class="dashboard-main">
    <div class="tv-wrap">
      <h1 class="tv-h">My Visits</h1>
      <p class="tv-sub" id="tv-sub">Your assigned generator service visits.</p>
      <div id="tv-list"><p class="tv-sub">Loading…</p></div>
    </div>
  </main>

  <!-- Visit detail (full-screen) -->
  <div id="tvd" class="tvd-overlay" aria-hidden="true">
    <div class="tvd-panel">
      <div class="tvd-head">
        <button type="button" class="btn btn-ghost btn-sm tvd-back" id="tvd-back" aria-label="Back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 5.5-6.5 6.5 6.5 6.5"/></svg></button>
        <div class="tvd-title">Visit detail</div>
      </div>
      <div class="tvd-body" id="tvd-body"><p>Loading…</p></div>
    </div>
  </div>

  <script src="shared-nav.js"></script>
  <script src="icons.js"></script>
  <script src="ui-dialogs.js"></script>
  <script src="tech.js"></script>
</body>
</html>
