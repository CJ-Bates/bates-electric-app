<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Bates Electric" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=7" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <title>Bates Electric Ã¢ÂÂ Home</title>
</head>
<body class="hub-body">

  <!-- Hardcoded fallback topbar (shared-nav.js will skip injecting if this is present) -->
  <header class="app-topbar" style="position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(255,255,255,0.92);border-bottom:1px solid rgba(0,0,0,0.06);backdrop-filter:saturate(120%) blur(8px);-webkit-backdrop-filter:saturate(120%) blur(8px);">
    <button class="topbar-hamburger" id="hamburgerBtn" aria-label="Open menu" type="button" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.95);border:1px solid rgba(31,58,95,0.20);border-radius:12px;color:#1F3A5F;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,0.06);">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
    </button>
    <h1 class="topbar-title" style="margin:0;font-size:1rem;font-weight:600;color:#1F3A5F;">Home</h1>
    <button class="topbar-signout" id="topbarSignOut" aria-label="Sign out" type="button" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:transparent;border:none;color:#1F3A5F;cursor:pointer;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
    </button>
  </header>


  <!-- Animated gradient mesh background -->
  <div class="hub-aurora" aria-hidden="true">
    <span class="hub-blob hub-blob-1"></span>
    <span class="hub-blob hub-blob-2"></span>
    <span class="hub-blob hub-blob-3"></span>
  </div>

  <main class="hub-main">
    <!-- Hero greeting -->
    <section class="hub-hero" id="hub-hero">
      <div class="hub-hero-text">
        <div class="hub-hero-meta">
          <span class="hub-hero-eyebrow" id="hero-date">&nbsp;</span>
          <span class="hub-hero-weather" id="hero-weather" hidden role="button" tabindex="0">
            <span class="hub-hero-weather-icon" id="hero-weather-icon"></span>
            <span class="hub-hero-weather-temp" id="hero-weather-temp"></span>
            <span class="hub-hero-weather-loc" id="hero-weather-loc"></span>
          </span>
        </div>
        <h1 class="hub-hero-title">
          <span id="hero-greet">Welcome</span><span class="hub-hero-comma">,</span>
          <span class="hub-hero-name" id="hero-name">there</span>
        </h1>
        <p class="hub-hero-sub" id="hero-sub">Field Hub</p>
      </div>
      <div class="hub-hero-badge" id="hero-badge">
        <div class="hub-hero-badge-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </div>
        <div class="hub-hero-badge-text">
          <strong>Stay safe</strong>
          <span>Verify zero energy</span>
        </div>
      </div>
    </section>

    <!-- Search Bar -->
    <section class="dashboard-search" id="search-section">
      <div class="search-wrap">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input class="search-input" type="search" id="dashboard-search" placeholder="Search inspections, docs, contacts...">
      </div>
    </section>

    <!-- Featured Actions -->
    <section id="featured-section">
      <div class="section-label">Job tools</div>
      <div class="featured-actions" id="featured-actions-grid">
        <!-- Populated by home.js based on role -->
      </div>
    </section>

    <!-- Quick Links Grid -->
    <section id="quick-links-section">
      <div class="section-label">Quick links</div>
      <div class="quick-grid" id="quick-links-grid">
        <!-- Populated by home.js -->
      </div>
    </section>

  </main>

  <script src="home.js"></script>
  <script src="shared-nav.js"></script>
</body>
</html>
