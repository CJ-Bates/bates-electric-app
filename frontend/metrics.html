  <title>Bates Electric &mdash; Metrics</title>

       switching between Generator Care tabs no longer reloads the document.
       This page only exists so old bookmarks / PWA home-screen shortcuts
       still land somewhere — a client-side redirect (not a server 30x)
       because it must also work offline, from cache, under the service
       worker, and must preserve the #hash (a real HTTP redirect followed by
       the SW's network-first fetch() strips URL fragments). -->
